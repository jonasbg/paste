{{- range $key, $value := .Values }}
{{- range $value.mounts }}
{{- if not (or .fromSecret .inMemory .config .statefulSet) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $key }}-{{ .name }}-pvc
spec:
  accessModes:
  {{- with .accessModes }}
    {{- toYaml . | nindent 4 }}
  {{- else }}
    - ReadWriteOnce
  {{- end }}
  {{- with .storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .storage | default "1Gi" }}
{{- end }}
{{- end }}
{{- end }}